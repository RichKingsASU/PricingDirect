<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pricing Logistics</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        body { background-color: #F4F7FA; font-family: 'Inter', sans-serif; color: #14213D; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow-sm border-0" style="width: 400px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <span class="material-symbols-outlined text-primary" style="font-size: 48px;">local_shipping</span>
                <h4 class="fw-bold mt-2">Forrest Logistics</h4>
                <p class="text-muted text-uppercase" style="font-size: 12px; letter-spacing: 1px;">Pricing Platform</p>
            </div>
            
            {% if form.errors %}
                <div class="alert alert-danger" style="font-size: 13px;">
                    Your username and password didn't match. Please try again.
                </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold" style="font-size: 12px;">Username</label>
                    <input type="text" name="username" class="form-control" autofocus required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold" style="font-size: 12px;">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Sign In</button>
                <input type="hidden" name="next" value="{{ next }}">
            </form>
        </div>
    </div>

</body>
</html>
